name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
  NEXT_PUBLIC_MICROSOFT_CLARITY_ID: ${{ vars.NEXT_PUBLIC_MICROSOFT_CLARITY_ID }}
  NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADSENSE_ID }}
  NEXT_PUBLIC_AD_BANNER_728X90: ${{ vars.NEXT_PUBLIC_AD_BANNER_728X90 }}
  NEXT_PUBLIC_AD_BANNER_300X250: ${{ vars.NEXT_PUBLIC_AD_BANNER_300X250 }}
  NEXT_PUBLIC_AD_BANNER_468X60: ${{ vars.NEXT_PUBLIC_AD_BANNER_468X60 }}
  NEXT_PUBLIC_AD_SIDEBAR_160X600: ${{ vars.NEXT_PUBLIC_AD_SIDEBAR_160X600 }}
  NEXT_PUBLIC_AD_SIDEBAR_160X300: ${{ vars.NEXT_PUBLIC_AD_SIDEBAR_160X300 }}
  NEXT_PUBLIC_AD_MOBILE_320X50: ${{ vars.NEXT_PUBLIC_AD_MOBILE_320X50 }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static export
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
